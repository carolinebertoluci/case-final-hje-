<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navega Saúde – Demandas por comunidade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="pular" href="#principal">Ir para o conteúdo</a>

  <header class="topo">
    <h1>Navega Saúde</h1>
    <div class="abas" role="tablist" aria-label="Escolha a tela">
      <button type="button" role="tab" id="aba-acs" aria-selected="true" aria-controls="tela-acs">Agente de saúde</button>
      <button type="button" role="tab" id="aba-coord" aria-selected="false" aria-controls="tela-coord" tabindex="-1">Coordenação</button>
    </div>
  </header>

  <main id="principal">

    <!-- TELA DO ACS -->
    <section id="tela-acs" role="tabpanel" aria-labelledby="aba-acs">
      <h2>Registrar demanda</h2>
      <p class="intro">Preencha os dados do paciente. Os campos com <span class="obrig">*</span> são obrigatórios.</p>

      <div id="resumo-erros" class="resumo-erros" role="alert" tabindex="-1" hidden></div>
      <div id="confirmacao" class="confirmacao" role="status" tabindex="-1" hidden></div>

      <form id="form-demanda" novalidate>

        <div class="campo">
          <label for="comunidade">Comunidade <span class="obrig">*</span></label>
          <select id="comunidade" name="comunidade" aria-describedby="ajuda-comunidade erro-comunidade">
            <option value="">Selecione a comunidade…</option>
          </select>
          <p class="ajuda" id="ajuda-comunidade"></p>
          <p class="erro" id="erro-comunidade" hidden></p>
        </div>

        <fieldset class="campo" aria-describedby="erro-tipo">
          <legend>Tipo de atendimento <span class="obrig">*</span></legend>
          <div class="opcoes opcoes-tipo" id="opcoes-tipo"></div>
          <p class="erro" id="erro-tipo" hidden></p>
        </fieldset>

        <fieldset class="campo" aria-describedby="erro-prioridade">
          <legend>Prioridade <span class="obrig">*</span></legend>
          <div class="opcoes opcoes-prioridade">
            <label class="opcao">
              <input type="radio" name="prioridade" value="rotina">
              <span><strong>Rotina</strong><small>Pode aguardar a agenda normal</small></span>
            </label>
            <label class="opcao opcao-prio">
              <input type="radio" name="prioridade" value="prioritaria">
              <span><strong>Prioritária</strong><small>Precisa ser atendida primeiro</small></span>
            </label>
          </div>
          <p class="erro" id="erro-prioridade" hidden></p>
        </fieldset>

        <fieldset class="campo paciente">
          <legend>Identificação do paciente</legend>

          <div class="campo">
            <label for="nome">Nome completo <span class="obrig">*</span></label>
            <input type="text" id="nome" name="nome" autocomplete="off" aria-describedby="erro-nome">
            <p class="erro" id="erro-nome" hidden></p>
          </div>

          <div class="linha">
            <div class="campo">
              <label for="nascimento">Data de nascimento <span class="obrig">*</span></label>
              <input type="date" id="nascimento" name="nascimento" aria-describedby="erro-nascimento">
              <p class="erro" id="erro-nascimento" hidden></p>
            </div>
            <div class="campo">
              <label for="cartaoSus">Cartão SUS <span class="opcional">(se tiver)</span></label>
              <input type="text" id="cartaoSus" name="cartaoSus" inputmode="numeric" autocomplete="off" aria-describedby="ajuda-sus erro-cartaoSus">
              <p class="ajuda" id="ajuda-sus">São 15 números. Pode deixar em branco.</p>
              <p class="erro" id="erro-cartaoSus" hidden></p>
            </div>
          </div>
        </fieldset>

        <button type="submit" class="botao-principal">Registrar demanda</button>
      </form>
    </section>

    <!-- TELA DA COORDENAÇÃO -->
    <section id="tela-coord" role="tabpanel" aria-labelledby="aba-coord" hidden>
      <h2>Próxima rota</h2>
      <p class="intro">Demandas que ainda aguardam atendimento, por comunidade.</p>
      <div id="resumo-rota" class="resumo-rota"></div>
      <div id="lista-comunidades" class="lista-comunidades"></div>
    </section>

  </main>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
